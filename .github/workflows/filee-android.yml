name: Filee Android (experimental)

on:
  workflow_dispatch:
  push:
    branches: [feature/android-alpha]
    paths:
      - 'src/Filee.Android/**'
      - 'src/Filee.Core/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - '.github/workflows/filee-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Filee
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install android
      - name: Download CC0 HEIC regression fixtures
        run: |
          mkdir -p src/Filee.Android/ci/fixtures
          curl --fail --location --retry 3 --silent --show-error \
            https://heic.fyi/samples/basic-8bit-srgb.heic \
            -o src/Filee.Android/ci/fixtures/basic-8bit-srgb.heic
          curl --fail --location --retry 3 --silent --show-error \
            https://heic.fyi/samples/orientation-6.heic \
            -o src/Filee.Android/ci/fixtures/orientation-6.heic
          echo "3fe7d32e5568f8bfd6b5d3290e61ac9b964d08464d388fa064f69cddddfee82c  src/Filee.Android/ci/fixtures/basic-8bit-srgb.heic" | sha256sum -c -
          echo "80b615ae433d7ec53e9aaaeee081ecd11c0d9931350da13d6ce4e2b363d12c12  src/Filee.Android/ci/fixtures/orientation-6.heic" | sha256sum -c -
      - name: Build APK
        run: dotnet publish src/Filee.Android/Filee.Android.csproj -c Release -p:AndroidPackageFormat=apk
      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: filee-android-alpha-apk
          path: src/Filee.Android/bin/Release/**/*.apk
          if-no-files-found: error
      - name: Enable hardware acceleration for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK in Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash src/Filee.Android/ci/smoke-test.sh
      - name: Upload emulator logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filee-android-startup-diagnostics
          path: /tmp/filee-ci/
          if-no-files-found: ignore
